<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter — EconIQ</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f1ed;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Top nav ── */
    .topnav {
      padding: 54px 24px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeUp 0.35s ease both;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #eae8e2;
      border: 1px solid #d8d5ce;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
    }

    .back-btn:active { transform: scale(0.93); opacity: 0.8; }

    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }

    .page-sub {
      font-size: 12px;
      color: #999893;
      margin-top: 2px;
    }

    /* ── Coming soon content ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      text-align: center;
      animation: fadeUp 0.38s ease 0.1s both;
    }

    .coming-icon {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: #dce9ea;
      border: 1px solid #bcd4d7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 26px;
    }

    .coming-chapter {
      font-size: 11px;
      font-weight: 700;
      color: #2d7a84;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .coming-title {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .coming-sub {
      font-size: 14px;
      color: #999893;
      line-height: 1.65;
      max-width: 290px;
    }

    .coming-tag {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #dce9ea;
      border: 1px solid #bcd4d7;
      color: #2d7a84;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 9px 18px;
      border-radius: 12px;
    }

  </style>
</head>
<body>

  <!-- TOP NAV -->
  <div class="topnav">
    <a href="financial-markets-home.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <div>
      <div class="page-title" id="nav-title">Chapter</div>
      <div class="page-sub">Financial Markets, Credit &amp; Banking</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="coming-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2d7a84" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <div class="coming-chapter" id="chapter-label">Chapter</div>
    <div class="coming-title" id="chapter-title">Content Coming Soon</div>
    <div class="coming-sub">This chapter is currently being prepared. Lessons, interactive exercises, and exam questions will be available here.</div>
    <div class="coming-tag">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2d7a84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
      In Development
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var ch    = params.get('ch');
      var title = params.get('title');

      if (ch && title) {
        var decoded = decodeURIComponent(title.replace(/\+/g, ' '));
        document.getElementById('nav-title').textContent   = 'Chapter ' + ch;
        document.getElementById('chapter-label').textContent = 'Chapter ' + ch;
        document.getElementById('chapter-title').textContent = decoded;
      }
    })();
  </script>

</body>
</html>
